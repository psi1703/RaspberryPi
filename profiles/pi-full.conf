# InitBox Raspberry Pi 3 / 4 / 5 / Compute Module 4 / Compute Module 5 profile

PROFILE_ID="pi-full"
PROFILE_NAME="Raspberry Pi 3 / 4 / 5 / CM4 / CM5"
PROFILE_DESCRIPTION="Full InitBox field appliance with Dashboard-controlled operational roles"

# Lab / field policy
REQUIRES_LAB_INTERNET="yes"
FIELD_INSTALL_ALLOWED="no"

# Management capability policy
SUPPORTS_DASHBOARD="yes"
SUPPORTS_WEB_TERMINAL="yes"
DASHBOARD_INSTALL_POLICY="prompt"
PRIMARY_MANAGEMENT_INTERFACE="web-terminal"

# Supported modules. Supported means the module exists for this hardware.
# Operational modules are installed so the Dashboard can expose their toggles,
# but their runtime roles must remain OFF until the operator enables them.
MODULE_HOTSPOT="yes"
MODULE_RUNTIME_CONTROL="yes"
MODULE_WEB_TERMINAL="yes"
MODULE_DASHBOARD="yes"
MODULE_ISI="yes"
MODULE_SNIFFER_BRIDGE="yes"
MODULE_FMS="yes"
MODULE_RTC="yes"

# Installed baseline roster.
#
# ISI, sniffer-bridge, and FMS must be installed during Pi-full setup so the
# Dashboard can show and control their toggles. Installation must not activate
# their roles or leave their field services running.
DEFAULT_MODULES="hotspot runtime-control web-terminal sniffer-bridge isi fms rtc"

# Operational modules are installed but inactive by default.
# The operator activates/deactivates them through pi-rolectl.sh or Dashboard toggles.
OPERATIONAL_MODULES="sniffer-bridge isi fms"

PROFILE_NOTES="React Dashboard is supported and optional. Pi-full installs operational modules for Dashboard control, but active roles remain empty until explicitly enabled by the operator."
