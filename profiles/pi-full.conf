# InitBox Raspberry Pi 3 / 4 / 5 / Compute Module 4 / Compute Module 5 profile

PROFILE_ID="pi-full"
PROFILE_NAME="Raspberry Pi 3 / 4 / 5 / CM4 / CM5"
PROFILE_DESCRIPTION="Full InitBox management baseline with optional React dashboard and operator-enabled field roles"

# Lab / field policy
REQUIRES_LAB_INTERNET="yes"
FIELD_INSTALL_ALLOWED="no"

# Management capability policy
SUPPORTS_DASHBOARD="yes"
SUPPORTS_WEB_TERMINAL="yes"
DASHBOARD_INSTALL_POLICY="prompt"
PRIMARY_MANAGEMENT_INTERFACE="web-terminal"

# Supported modules. Supported means the module exists for this hardware.
# It does not mean the installer may activate the field runtime automatically.
MODULE_HOTSPOT="yes"
MODULE_RUNTIME_CONTROL="yes"
MODULE_WEB_TERMINAL="yes"
MODULE_DASHBOARD="yes"
MODULE_ISI="yes"
MODULE_SNIFFER_BRIDGE="yes"
MODULE_FMS="yes"
MODULE_RTC="yes"

# Management-first baseline.
#
# Do not include ISI, sniffer-bridge, or FMS here. Those modules can manipulate
# field buses, bridge state, or role-driven services. The installer owns the
# safe baseline roster and leaves operational roles OFF until the operator
# explicitly enables them after management access is verified.
DEFAULT_MODULES="hotspot runtime-control web-terminal rtc"

# Operational modules are supported but not part of the default baseline.
# They must be installed/enabled explicitly by an operator workflow.
OPERATIONAL_MODULES="sniffer-bridge isi fms"

PROFILE_NOTES="React Dashboard is supported and optional. Pi-full baseline installs only management-safe modules. ISI, sniffer-bridge, and FMS remain operator-controlled and must not activate during install."
