# InitBox Raspberry Pi 3 / 4 / 5 / Compute Module 4 / Compute Module 5 profile

PROFILE_ID="pi-full"
PROFILE_NAME="Raspberry Pi 3 / 4 / 5 / CM4 / CM5"
PROFILE_DESCRIPTION="Full InitBox field appliance with optional React dashboard"

# Lab / field policy
REQUIRES_LAB_INTERNET="yes"
FIELD_INSTALL_ALLOWED="no"

# Management capability policy
SUPPORTS_DASHBOARD="yes"
SUPPORTS_WEB_TERMINAL="yes"
DASHBOARD_INSTALL_POLICY="prompt"
PRIMARY_MANAGEMENT_INTERFACE="web-terminal"

# Supported modules
MODULE_HOTSPOT="yes"
MODULE_WEB_TERMINAL="yes"
MODULE_DASHBOARD="yes"
MODULE_ISI="yes"
MODULE_SNIFFER_BRIDGE="yes"
MODULE_FMS="yes"
MODULE_RTC="yes"

# Dashboard is intentionally not included here. The unified installer must ask
# explicitly whether to install it on supported hardware. When selected, the
# installer inserts dashboard after web-terminal and before sniffer-bridge.
DEFAULT_MODULES="hotspot web-terminal sniffer-bridge isi fms rtc"

PROFILE_NOTES="React Dashboard is supported but optional. The installer must explicitly ask whether to install it. Web Terminal remains available regardless of that choice."
