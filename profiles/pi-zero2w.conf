# InitBox Raspberry Pi Zero W / Zero 2 W profile

PROFILE_ID="pi-zero2w"
PROFILE_NAME="Raspberry Pi Zero W / Zero 2 W"
PROFILE_DESCRIPTION="Lightweight InitBox field appliance for Raspberry Pi Zero-class hardware"

# Lab / field policy
REQUIRES_LAB_INTERNET="yes"
FIELD_INSTALL_ALLOWED="no"

# Management capability policy
SUPPORTS_DASHBOARD="no"
SUPPORTS_WEB_TERMINAL="yes"
DASHBOARD_INSTALL_POLICY="disabled"
PRIMARY_MANAGEMENT_INTERFACE="web-terminal"

# Supported modules
MODULE_HOTSPOT="yes"
MODULE_WEB_TERMINAL="yes"
MODULE_DASHBOARD="no"
MODULE_ISI="yes"
MODULE_SNIFFER_BRIDGE="yes"
MODULE_FMS="yes"
MODULE_RTC="no"

# Install order matters on Pi Zero-class hardware:
#   1. hotspot provides local field access.
#   2. web-terminal provides the management interface.
#   3. isi owns and creates br0 for the namespace topology.
#   4. sniffer-bridge waits for and captures from the ISI bridge topology.
#   5. fms is independent and uses native SocketCAN.
DEFAULT_MODULES="hotspot web-terminal isi sniffer-bridge fms"

PROFILE_NOTES="Dashboard and RTC modules are blocked on Pi Zero W / Zero 2 W. Web Terminal is the management interface."
