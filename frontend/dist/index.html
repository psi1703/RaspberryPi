<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InitBox Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111f;
        --panel: #0f1b2d;
        --panel2: #0b1525;
        --line: #22324a;
        --text: #eef5ff;
        --muted: #93a4bd;
        --blue: #2f6fed;
        --blue2: #1d4ed8;
        --green: #059669;
        --green-bg: #063d31;
        --red-bg: #4c1111;
        --neutral: #2a3446;
        --shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: radial-gradient(circle at top left, rgba(47, 111, 237, 0.12), transparent 30rem), var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: clamp(12px, 0.72vw, 14px);
      }

      h1, h2, p { margin-top: 0; }
      h1 { font-size: clamp(1.2rem, 1.45vw, 1.75rem); margin: 0; line-height: 1.05; }
      h2 { font-size: 0.95rem; margin: 0; }
      p { color: var(--muted); margin-bottom: 0; }

      button, .button {
        border: 0;
        border-radius: 0.62rem;
        background: var(--blue);
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.15rem;
        padding: 0.42rem 0.75rem;
        font-weight: 800;
        text-decoration: none;
        font-size: 0.82rem;
      }

      button:hover, .button:hover { background: var(--blue2); }
      button:disabled { cursor: not-allowed; opacity: 0.55; }
      .secondary { background: #1d2a3e; border: 1px solid var(--line); }
      .secondary:hover { background: #263853; }
      .danger { background: #b42318; border: 1px solid #d92d20; }
      .danger:hover { background: #d92d20; }

      .topbar {
        min-height: 3.75rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        padding: 0.55rem 0.75rem;
        background: rgba(15, 27, 45, 0.88);
        border-bottom: 1px solid var(--line);
      }

      .brand { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
      .brand img { width: clamp(3.1rem, 4vw, 4.4rem); height: clamp(2.1rem, 2.8vw, 3rem); object-fit: contain; background: #fff; border-radius: 0.25rem; flex: 0 0 auto; }
      .brand p { display: none; }
      .header-actions { display: flex; gap: 0.45rem; align-items: center; flex: 0 0 auto; }

      .dashboard {
        padding: clamp(0.45rem, 0.65vw, 0.8rem);
        display: grid;
        gap: clamp(0.45rem, 0.65vw, 0.8rem);
      }

      .card {
        background: rgba(15, 27, 45, 0.92);
        border: 1px solid var(--line);
        border-radius: 0.9rem;
        padding: clamp(0.5rem, 0.7vw, 0.75rem);
        box-shadow: var(--shadow);
        min-width: 0;
      }

      .wide { grid-column: 1 / -1; }
      .card-head, .card-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.55rem; margin-bottom: 0.45rem; }
      .subtle, .muted { color: var(--muted); font-size: 0.74rem; font-weight: 800; }

      .summary-grid {
        display: grid;
        grid-template-columns: minmax(min(100%, 22rem), max-content) minmax(min(100%, 40rem), 1fr);
        gap: clamp(0.45rem, 0.65vw, 0.8rem);
        align-items: start;
      }

      .roles-card { align-self: start; }
      .role-list { display: grid; grid-template-columns: repeat(3, minmax(6.8rem, 1fr)); gap: 0.4rem; }
      .role-toggle {
        min-height: 2.45rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.35rem;
        border: 1px solid var(--line);
        border-radius: 0.65rem;
        background: var(--panel2);
        color: var(--text);
        padding: 0.38rem 0.42rem;
        text-align: left;
      }
      .role-toggle:hover { background: #13243a; }
      .role-toggle.on { border-color: rgba(5, 150, 105, 0.8); background: rgba(5, 150, 105, 0.14); }
      .role-text { min-width: 0; }
      .role-text strong { display: block; font-size: 0.82rem; line-height: 1.05; white-space: nowrap; }
      .role-text small { display: block; max-width: 4.2rem; margin-top: 0.12rem; color: var(--muted); font-size: 0.56rem; font-weight: 800; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .switch { width: 2rem; height: 1.15rem; border-radius: 999px; padding: 0.13rem; background: #344155; flex: 0 0 auto; }
      .switch span { display: block; width: 0.86rem; height: 0.86rem; border-radius: 999px; background: #fff; transition: transform 120ms ease; }
      .role-toggle.on .switch { background: var(--green); }
      .role-toggle.on .switch span { transform: translateX(0.84rem); }

      .system-card {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        align-content: flex-start;
        gap: 0.38rem;
        overflow: visible;
      }
      .system-card .card-head { flex: 0 0 100%; margin-bottom: 0; }
      .metric-grid, .info-grid { display: contents; }
      .tile {
        flex: 0 0 auto;
        width: max-content;
        max-width: 100%;
        min-height: 2.95rem;
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 0.65rem;
        padding: 0.42rem 0.48rem;
      }
      .tile span { display: block; color: var(--muted); font-size: 0.62rem; font-weight: 900; line-height: 1.05; margin-bottom: 0.32rem; white-space: nowrap; }
      .tile strong { display: block; color: var(--text); font-size: 0.72rem; line-height: 1.15; font-weight: 900; white-space: nowrap; overflow: visible; }
      .metric-grid .tile { min-width: 4.1rem; }
      .metric-grid .tile strong { font-size: 0.95rem; }

      .ops-card { padding: clamp(0.45rem, 0.6vw, 0.65rem); }
      .ops-grid {
        display: grid;
        grid-template-columns: minmax(min(100%, 30rem), 0.75fr) minmax(min(100%, 30rem), 1fr);
        gap: 0.5rem;
        align-items: stretch;
      }
      .services-list, .logs-panel, .file-list { background: var(--panel2); border: 1px solid var(--line); border-radius: 0.65rem; overflow: hidden; }
      .service-row { width: 100%; min-height: 1.95rem; display: grid; grid-template-columns: 5rem minmax(9rem, 1fr) auto; gap: 0.42rem; align-items: center; border-radius: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 0.3rem 0.42rem; text-align: left; }
      .service-row:last-child { border-bottom: 0; }
      .service-row:hover, .service-row.selected { background: #13243a; }
      .service-name { font-weight: 900; color: var(--text); font-size: 0.78rem; }
      .service-unit { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.76rem; }
      .pill-group { display: flex; gap: 0.25rem; justify-content: flex-end; flex-wrap: wrap; }
      .pill { border-radius: 999px; padding: 0.12rem 0.38rem; font-size: 0.66rem; font-weight: 900; background: var(--neutral); color: #dbeafe; }
      .pill.ok { background: var(--green-bg); color: #a7f3d0; }
      .pill.off { background: var(--red-bg); color: #fecaca; }
      .logs-title { min-height: 1.9rem; padding: 0.42rem 0.55rem; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 900; }
      pre { margin: 0; height: clamp(9rem, 18vh, 14rem); overflow: auto; white-space: pre-wrap; padding: 0.5rem; color: #dbeafe; font-size: 0.72rem; line-height: 1.32; }

      .utility-grid {
        display: grid;
        grid-template-columns: minmax(min(100%, 13rem), max-content) minmax(min(100%, 11rem), max-content) minmax(min(100%, 30rem), 1fr);
        gap: 0.5rem;
        align-items: stretch;
      }
      .utility-card, .files-card { min-height: clamp(7.2rem, 12vh, 9rem); }
      .utility-card { display: grid; gap: 0.45rem; align-content: start; }
      .utility-card code { display: block; background: #020817; border: 1px solid var(--line); border-radius: 0.55rem; color: #dbeafe; padding: 0.38rem 0.45rem; overflow-wrap: anywhere; font-size: 0.68rem; }
      .button-row { display: flex; gap: 0.38rem; align-items: center; flex-wrap: wrap; }
      .upload-row { display: flex; gap: 0.38rem; align-items: center; flex-wrap: wrap; padding: 0.45rem; background: var(--panel2); border: 1px solid var(--line); border-radius: 0.65rem; margin-bottom: 0.45rem; }
      .upload-row input { color: var(--muted); max-width: 14rem; font-size: 0.76rem; }
      .upload-row span { color: var(--muted); font-size: 0.75rem; font-weight: 800; }
      .file-row { display: grid; grid-template-columns: minmax(12rem, 1fr) 5rem 7rem; gap: 0.45rem; align-items: center; padding: 0.38rem 0.5rem; border-bottom: 1px solid var(--line); }
      .file-row:last-child { border-bottom: 0; }
      .file-row span { font-weight: 800; overflow-wrap: anywhere; }
      .file-row small { color: var(--muted); font-weight: 800; }

      .error, .notice { display: flex; align-items: center; justify-content: space-between; gap: 0.55rem; padding: 0.45rem 0.6rem; border-radius: 0.65rem; border: 1px solid rgba(239, 68, 68, 0.35); background: var(--red-bg); color: #fecaca; }
      .notice { border-color: rgba(47, 111, 237, 0.35); background: #0b2545; color: #dbeafe; }
      .login-page { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
      .login-card { width: min(26rem, 100%); background: rgba(15, 27, 45, 0.94); border: 1px solid var(--line); border-radius: 1.35rem; padding: 1.6rem; box-shadow: var(--shadow); }
      .login-brand { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.25rem; }
      .login-brand img { width: 4.75rem; height: 3.25rem; object-fit: contain; background: #fff; border-radius: 0.25rem; }
      .login-card form { display: grid; gap: 0.8rem; }
      .login-card label { display: grid; gap: 0.38rem; color: var(--muted); font-weight: 800; }
      .login-card input { min-height: 2.5rem; border: 1px solid var(--line); border-radius: 0.65rem; background: #07101e; color: var(--text); padding: 0.55rem 0.7rem; }

      @media (max-width: 70rem) {
        .summary-grid, .ops-grid, .utility-grid { grid-template-columns: 1fr; }
        .role-list { grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); }
      }

      @media (max-width: 38rem) {
        .topbar { align-items: flex-start; flex-direction: column; }
        .dashboard { padding: 0.5rem; }
        .service-row, .file-row { grid-template-columns: 1fr; }
        .pill-group { justify-content: flex-start; }
        .tile { width: 100%; }
      }
    </style>
    <script defer src="/assets/initbox-lite.js?v=20260904d"></script>
  </head>
  <body>
    <div id="root"><main class="login-page"><section class="login-card"><h1>Loading InitBox Dashboard...</h1></section></main></div>
  </body>
</html>
