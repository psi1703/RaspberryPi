<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InitBox Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111f;
        --panel: #0f1b2d;
        --panel2: #0b1525;
        --line: #22324a;
        --text: #eef5ff;
        --muted: #93a4bd;
        --blue: #2f6fed;
        --blue2: #1d4ed8;
        --green: #059669;
        --green-bg: #063d31;
        --red: #ef4444;
        --red-bg: #4c1111;
        --neutral: #2a3446;
        --shadow: 0 12px 26px rgba(0, 0, 0, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: radial-gradient(circle at top left, rgba(47, 111, 237, 0.12), transparent 30rem), var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 13px;
      }

      h1, h2, p { margin-top: 0; }
      h1 { font-size: clamp(1.25rem, 1.6vw, 1.7rem); margin: 0; line-height: 1.05; }
      h2 { font-size: 0.95rem; margin: 0; }
      p { color: var(--muted); margin-bottom: 0; }

      button, .button {
        border: 0;
        border-radius: 9px;
        background: var(--blue);
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        padding: 6px 10px;
        font-weight: 800;
        text-decoration: none;
        font-size: 0.82rem;
      }

      button:hover, .button:hover { background: var(--blue2); }
      button:disabled { cursor: not-allowed; opacity: 0.55; }
      .secondary { background: #1d2a3e; border: 1px solid var(--line); }
      .secondary:hover { background: #263853; }
      .danger { background: #b42318; border: 1px solid #d92d20; }
      .danger:hover { background: #d92d20; }

      .topbar {
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
        background: rgba(15, 27, 45, 0.88);
        border-bottom: 1px solid var(--line);
      }

      .brand { display: flex; align-items: center; gap: 10px; }
      .brand img { width: 58px; height: 38px; object-fit: contain; background: #fff; border-radius: 4px; }
      .brand p { display: none; }
      .header-actions { display: flex; gap: 7px; align-items: center; }

      .dashboard { padding: 8px; display: grid; gap: 8px; }
      .card {
        background: rgba(15, 27, 45, 0.92);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
        box-shadow: var(--shadow);
        min-width: 0;
      }

      .wide { grid-column: 1 / -1; }
      .summary-grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 8px; align-items: start; }
      .card-head, .card-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
      .subtle, .muted { color: var(--muted); font-size: 0.75rem; font-weight: 800; }

      .roles-card { min-height: 88px; }
      .role-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .role-toggle {
        min-height: 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel2);
        color: var(--text);
        padding: 6px 6px;
        text-align: left;
      }
      .role-toggle:hover { background: #13243a; }
      .role-toggle.on { border-color: rgba(5, 150, 105, 0.8); background: rgba(5, 150, 105, 0.14); }
      .role-text { min-width: 0; }
      .role-text strong { display: block; font-size: 0.82rem; line-height: 1.05; white-space: nowrap; }
      .role-text small { display: block; max-width: 66px; margin-top: 2px; color: var(--muted); font-size: 0.57rem; font-weight: 800; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .switch { width: 32px; height: 18px; border-radius: 999px; padding: 2px; background: #344155; flex: 0 0 auto; }
      .switch span { display: block; width: 14px; height: 14px; border-radius: 999px; background: #fff; transition: transform 120ms ease; }
      .role-toggle.on .switch { background: var(--green); }
      .role-toggle.on .switch span { transform: translateX(14px); }

      .system-card {
        display: grid;
        grid-template-columns: 64px 78px 64px 74px 110px 92px 168px 198px 145px 158px 72px;
        gap: 6px;
        align-items: stretch;
        overflow: visible;
      }
      .system-card .card-head { grid-column: 1 / -1; margin-bottom: 0; }
      .metric-grid, .info-grid { display: contents; }
      .tile {
        min-width: 0;
        min-height: 48px;
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 7px 7px;
      }
      .tile span { display: block; color: var(--muted); font-size: 0.62rem; font-weight: 900; line-height: 1.05; margin-bottom: 5px; white-space: nowrap; }
      .tile strong { display: block; color: var(--text); font-size: 0.68rem; line-height: 1.15; font-weight: 900; white-space: nowrap; overflow: visible; }
      .metric-grid .tile strong { font-size: 0.95rem; }

      .ops-card { padding: 9px; }
      .ops-grid { display: grid; grid-template-columns: 560px minmax(0, 1fr); gap: 8px; align-items: stretch; }
      .services-list, .logs-panel, .file-list { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      .service-row { width: 100%; min-height: 31px; display: grid; grid-template-columns: 76px minmax(150px, 1fr) auto; gap: 7px; align-items: center; border-radius: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 5px 7px; text-align: left; }
      .service-row:last-child { border-bottom: 0; }
      .service-row:hover, .service-row.selected { background: #13243a; }
      .service-name { font-weight: 900; color: var(--text); font-size: 0.78rem; }
      .service-unit { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.76rem; }
      .pill-group { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
      .pill { border-radius: 999px; padding: 2px 6px; font-size: 0.66rem; font-weight: 900; background: var(--neutral); color: #dbeafe; }
      .pill.ok { background: var(--green-bg); color: #a7f3d0; }
      .pill.off { background: var(--red-bg); color: #fecaca; }
      .logs-title { min-height: 30px; padding: 7px 9px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 900; }
      pre { margin: 0; height: 170px; overflow: auto; white-space: pre-wrap; padding: 8px; color: #dbeafe; font-size: 0.72rem; line-height: 1.32; }

      .utility-grid { display: grid; grid-template-columns: 205px 170px minmax(0, 1fr); gap: 8px; align-items: stretch; }
      .utility-card, .files-card { min-height: 120px; }
      .utility-card { display: grid; gap: 7px; align-content: start; }
      .utility-card code { display: block; background: #020817; border: 1px solid var(--line); border-radius: 8px; color: #dbeafe; padding: 6px 7px; overflow-wrap: anywhere; font-size: 0.68rem; }
      .button-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .upload-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 7px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 7px; }
      .upload-row input { color: var(--muted); max-width: 210px; font-size: 0.76rem; }
      .upload-row span { color: var(--muted); font-size: 0.75rem; font-weight: 800; }
      .file-row { display: grid; grid-template-columns: minmax(180px, 1fr) 80px 110px; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
      .file-row:last-child { border-bottom: 0; }
      .file-row span { font-weight: 800; overflow-wrap: anywhere; }
      .file-row small { color: var(--muted); font-weight: 800; }

      .error, .notice { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 9px; border-radius: 10px; border: 1px solid rgba(239, 68, 68, 0.35); background: var(--red-bg); color: #fecaca; }
      .notice { border-color: rgba(47, 111, 237, 0.35); background: #0b2545; color: #dbeafe; }
      .login-page { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
      .login-card { width: min(420px, 100%); background: rgba(15, 27, 45, 0.94); border: 1px solid var(--line); border-radius: 22px; padding: 26px; box-shadow: var(--shadow); }
      .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
      .login-brand img { width: 76px; height: 52px; object-fit: contain; background: #fff; border-radius: 4px; }
      .login-card form { display: grid; gap: 13px; }
      .login-card label { display: grid; gap: 6px; color: var(--muted); font-weight: 800; }
      .login-card input { min-height: 40px; border: 1px solid var(--line); border-radius: 10px; background: #07101e; color: var(--text); padding: 9px 11px; }

      @media (max-width: 1500px) {
        .summary-grid { grid-template-columns: 1fr; }
        .system-card { grid-template-columns: repeat(4, minmax(110px, 1fr)); }
        .metric-grid, .info-grid { display: contents; }
      }
      @media (max-width: 1150px) { .ops-grid, .utility-grid { grid-template-columns: 1fr; } .role-list { grid-template-columns: 1fr; } }
      @media (max-width: 620px) { .topbar { align-items: flex-start; flex-direction: column; } .dashboard { padding: 8px; } .service-row, .file-row { grid-template-columns: 1fr; } .pill-group { justify-content: flex-start; } }
    </style>
    <script defer src="/assets/initbox-lite.js?v=20260904c"></script>
  </head>
  <body>
    <div id="root"><main class="login-page"><section class="login-card"><h1>Loading InitBox Dashboard...</h1></section></main></div>
  </body>
</html>
